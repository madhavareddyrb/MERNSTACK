<!doctype html>
<html>
  <head>
    <title>LayOut of balance</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <section>
      <div class="logo">
        <span>⬅️</span>
        <img class="profile-img" src="images/images.png" alt="" />
        <span>🔒</span>
      </div>

      <div class="balance">
        <h4>Madhava's Balance</h4>
        <span>₹ 2000</span>
        <p>Updated on jan 6</p>
      </div>
      <div class="account-options">
        <div class="icons-heading">
          <img src="images/bank.png" alt="" />
          <h4>Accounts</h4>
        </div>
        <div class="icons-heading">
          <img src="images/transfer.png" alt="" />
          <h4>Transfers</h4>
        </div>
        <div class="icons-heading">
          <img src="images/recurring-payment.png" alt="" />
          <h4>Recurring</h4>
        </div>
        <div class="icons-heading">
          <img src="images/cash-flow.png" alt="" />
          <h4>Cash Flow</h4>
        </div>
      </div>
      <div class="banks">
        <div class="bank-1">
          <img class="bank-img" src="images/bank.png" alt="" />
          <div>
            <h4>State Bank India** 3567 ></h4>
            <p>via UPI</p>
          </div>
        </div>
        <div></div>
        <div>
          <p>₹ 1000</p>
          <a href="">check balance</a>
        </div>
      </div>
      <div class="banks">
        <div class="bank-1">
          <img class="bank-img" src="images/bank.png" alt="" />
          <div>
            <h4>Andhra Pradesh ** 4156></h4>
            <p>via UPI</p>
          </div>
        </div>
        <div></div>
        <div>
          <p>₹ 1000</p>
          <a href="">check balance</a>
        </div>
      </div>
      <div class="show-all">
        <a href="">show all accounts</a>
      </div>
      <h3 class="quick-heading">Quick Actions</h3>
      <div class="quick-div">
        <div class="quick-options-div">
          <img class="quick-actions-icons" src="images/send-money.png" alt="" />
          <button class="quick-options">Send Money</button>
        </div>
        <div class="quick-options-div">
          <img
            class="quick-actions-icons"
            src="images/self transfer.png"
            alt=""
          />
          <button class="quick-options">Self Transfer</button>
        </div>
        <div class="quick-options-div">
          <img class="quick-actions-icons" src="images/add-account.png" alt="" />
          <button class="quick-options">Add Account</button>
        </div>
      </div>
      <div>
        <h3>Your Transactions</h3>
      </div>
    </section>
  </body>
</html>
