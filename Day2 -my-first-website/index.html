<!doctype html>
<html>
  <head>
    <title>IRCTC Booking</title>
    <style>
      body {
        background-color: lightgreen;
        text-align: center;
        padding: 50px;
      }
      h1 {
        color: darkblue;
        font-size: 40px;
      }
      p {
        font-size: 18px;
        margin: 10px;
      }

      input {
        padding: 10px;
        font-size: 16px;
        width: 300px;
      }

      button {
        background-color: orange;
        color: white;
        padding: 10px 20px;
        font-size: 16px;
        border: none;
        cursor: pointer;
      }

      button:hover {
        background-color: darkorange;
      }
    </style>
  </head>
  <body>
    <h1>IRCTC</h1>
    <p>Book Train Tickets</p>
    <p>From Station:</p>
    <input type="text" />
    <br /><br />
    <p>To station:</p>
    <input type="text" />
    <br /><br />
    <p>Journey Date:</p>
    <input type="date" />

    <br /><br />

    <button>Search Trains</button>

    <br /><br />

    <p>Created by: <b>Madhava</b></p>
    <p>Number of passengers:</p>
    <input type="number" />
  </body>
</html>
